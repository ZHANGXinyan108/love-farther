<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>💑 异地恋 · 双人陪伴工具</title>
  <!-- Tailwind CSS + React + Firebase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    /* 简单优化滚动条和点击区域 */
    body { -webkit-tap-highlight-color: transparent; }
    button, a, .clickable { cursor: pointer; }
    input, textarea { font-size: 16px; } /* 防止iOS缩放 */
  </style>
</head>
<body class="bg-gradient-to-br from-pink-100 to-purple-100">
  <div id="root"></div>
  <script type="text/babel" data-presets="react">

    // ================= 1. Firebase 配置（请替换为你的实际配置） =================
    const firebaseConfig = {
      apiKey: "AIzaSyCRrXkEWvPXyYyiBl1ZWkyG9jjdDKwKEJM",
      authDomain: "love-farther.firebaseapp.com",
      databaseURL: "https://love-farther-default-rtdb.asia-southeast1.firebasedatabase.app",  // 注意改成你的真实URL
      projectId: "love-farther",
      storageBucket: "love-farther.firebasestorage.app",
      messagingSenderId: "320335695741",
      appId: "1:320335695741:web:ffca37f1053e0fe949c614"
    
    };
    // 初始化 Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // ================= 2. 工具函数 =================
    // 生成随机房间码（6位数字字母）
    const generateRoomCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();
    // 获取 URL 参数中的 room（例如 ?room=ABC123）
    const getRoomFromUrl = () => {
      const params = new URLSearchParams(window.location.search);
      return params.get('room');
    };
    // 更新 URL 中的 room 参数（不刷新页面）
    const setRoomInUrl = (room) => {
      const url = new URL(window.location);
      url.searchParams.set('room', room);
      window.history.replaceState({}, '', url);
    };

    // ================= 3. React 主应用 =================
    const { useState, useEffect } = React;

    const App = () => {
      const [room, setRoom] = useState('');
      const [myName, setMyName] = useState('');
      const [hasJoined, setHasJoined] = useState(false);
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('today'); // today, english, time, status, expense
      
      // 从 URL 读取房间（如果已有）
      useEffect(() => {
        const urlRoom = getRoomFromUrl();
        if (urlRoom) {
          setRoom(urlRoom);
          // 不自动加入，让用户输入昵称
        }
      }, []);

      // 加入房间（创建或加入）
      const joinRoom = async () => {
        if (!room.trim() || !myName.trim()) {
          alert('请填写房间码和你的昵称');
          return;
        }
        setLoading(true);
        const roomRef = database.ref(`rooms/${room}`);
        try {
          // 先读取房间信息，如果不存在则初始化
          const snapshot = await roomRef.once('value');
          let roomData = snapshot.val();
          if (!roomData) {
            // 新房间：初始化数据结构
            const newRoom = {
              members: { [myName]: { name: myName, joinedAt: Date.now() } },
              data: {
                today: {
                  english: { done: false, minutes: 0, content: '' },
                  time: { wakeUp: '', sleep: '', focus: 0 },
                  status: { text: '', image: '' },
                  expense: { amount: 0, category: '', note: '' }
                },
                feeds: [] // 最近动态（最多50条）
              },
              lastUpdate: Date.now()
            };
            await roomRef.set(newRoom);
          } else {
            // 已有房间，添加当前用户（如果还没加过）
            if (!roomData.members[myName]) {
              await roomRef.child(`members/${myName}`).set({
                name: myName,
                joinedAt: Date.now()
              });
            }
          }
          setHasJoined(true);
          setRoomInUrl(room);
        } catch (err) {
          console.error(err);
          alert('加入失败，请检查网络或房间码');
        } finally {
          setLoading(false);
        }
      };

      // 退出房间（清除状态）
      const leaveRoom = () => {
        setHasJoined(false);
        setRoom('');
        setMyName('');
        window.history.replaceState({}, '', window.location.pathname);
      };

      if (!hasJoined) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md">
              <h1 className="text-2xl font-bold text-center text-purple-700 mb-6">💑 双人空间</h1>
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">你的昵称</label>
                  <input
                    type="text"
                    value={myName}
                    onChange={e => setMyName(e.target.value)}
                    className="w-full border rounded-xl p-3"
                    placeholder="例如：小A"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">房间码（6位）</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={room}
                      onChange={e => setRoom(e.target.value.toUpperCase())}
                      className="flex-1 border rounded-xl p-3 uppercase"
                      placeholder="6位字母数字"
                      maxLength="6"
                    />
                    <button
                      onClick={() => setRoom(generateRoomCode())}
                      className="bg-gray-200 px-4 rounded-xl text-sm"
                    >
                      随机生成
                    </button>
                  </div>
                </div>
                <button
                  onClick={joinRoom}
                  disabled={loading}
                  className="w-full bg-purple-600 text-white py-3 rounded-xl font-bold disabled:opacity-50"
                >
                  {loading ? '加入中...' : '💗 加入房间'}
                </button>
                <p className="text-xs text-gray-500 text-center mt-4">
                  两人输入相同房间码即可进入同一空间，数据实时同步。
                </p>
              </div>
            </div>
          </div>
        );
      }

      // 已加入房间，渲染主界面（使用实时监听）
      return <MainApp room={room} myName={myName} onLeave={leaveRoom} database={database} />;
    };

    // 主界面组件（负责监听数据和更新）
    const MainApp = ({ room, myName, onLeave, database }) => {
      const [allData, setAllData] = useState(null);      // 整个房间数据
      const [members, setMembers] = useState([]);
      const [otherMember, setOtherMember] = useState(null);
      const [activeTab, setActiveTab] = useState('today');

      // 订阅房间数据变化
      useEffect(() => {
        const roomRef = database.ref(`rooms/${room}`);
        const listener = roomRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (!data) return;
          setAllData(data);
          // 提取成员列表（除了自己）
          const memberNames = Object.keys(data.members || {});
          setMembers(memberNames);
          const other = memberNames.find(name => name !== myName);
          setOtherMember(other ? { name: other, data: data.members[other] } : null);
        });
        return () => roomRef.off('value', listener);
      }, [room, myName, database]);

      // 更新某个模块的数据（今日数据）
      const updateTodayField = async (field, value) => {
        const updates = {};
        updates[`rooms/${room}/data/today/${field}`] = value;
        updates[`rooms/${room}/lastUpdate`] = Date.now();
        await database.ref().update(updates);
        // 添加一条动态（可加，但为了简洁暂不加）
      };

      // 添加动态消息
      const addFeed = async (actionText) => {
        const feedRef = database.ref(`rooms/${room}/data/feeds`);
        const newFeed = {
          user: myName,
          action: actionText,
          time: Date.now()
        };
        // 保留最近50条
        const snapshot = await feedRef.once('value');
        let feeds = snapshot.val() || [];
        feeds = [newFeed, ...feeds].slice(0, 50);
        await feedRef.set(feeds);
      };

      if (!allData) return <div className="text-center p-10">加载中...</div>;

      const todayData = allData.data?.today || {};
      const feeds = allData.data?.feeds || [];

      // 渲染不同标签页内容
      const renderContent = () => {
        switch (activeTab) {
          case 'today':
            return <TodayView myName={myName} otherName={otherMember?.name} todayData={todayData} otherTodayData={{}} />;
          case 'english':
            return <EnglishView todayData={todayData.english} onSave={async (minutes, content) => {
              await updateTodayField('english', { done: true, minutes, content });
              await addFeed(`完成了英语学习 ${minutes} 分钟`);
            }} />;
          case 'time':
            return <TimeView todayData={todayData.time} onSave={async (wakeUp, sleep, focus) => {
              await updateTodayField('time', { wakeUp, sleep, focus });
              await addFeed(`作息：起床 ${wakeUp}，睡觉 ${sleep}`);
            }} />;
          case 'status':
            return <StatusView todayData={todayData.status} onSave={async (text, image) => {
              await updateTodayField('status', { text, image });
              await addFeed(`发布了新状态：${text.substring(0, 20)}`);
            }} />;
          case 'expense':
            return <ExpenseView todayData={todayData.expense} onSave={async (amount, category, note) => {
              await updateTodayField('expense', { amount, category, note });
              await addFeed(`记账：${category} 消费 ${amount} 元`);
            }} />;
          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen p-4 pb-24">
          <div className="max-w-md mx-auto">
            {/* 头部 */}
            <div className="bg-white rounded-2xl shadow-md p-4 mb-4 flex justify-between items-center">
              <div>
                <h2 className="text-xl font-bold text-purple-800">{myName} ❤️ {otherMember?.name || '等待对方'}</h2>
                <p className="text-xs text-gray-400">房间码: {room}</p>
              </div>
              <button onClick={onLeave} className="text-gray-400 text-sm border px-3 py-1 rounded-full">退出</button>
            </div>

            {/* 双人今日概览卡（今日tab显示） */}
            {activeTab === 'today' && (
              <div className="bg-white rounded-2xl shadow-md p-4 mb-4">
                <h3 className="font-bold mb-2">📆 今日打卡状态</h3>
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-purple-50 rounded-xl p-3 text-center">
                    <div className="font-bold">{myName}</div>
                    <div className="text-sm">📖 {todayData.english?.done ? '✅' : '⭕'}</div>
                    <div className="text-sm">⏰ {todayData.time?.wakeUp ? '✅' : '⭕'}</div>
                    <div className="text-sm">📷 {todayData.status?.text ? '✅' : '⭕'}</div>
                    <div className="text-sm">💰 {todayData.expense?.amount ? '✅' : '⭕'}</div>
                  </div>
                  <div className="bg-pink-50 rounded-xl p-3 text-center">
                    <div className="font-bold">{otherMember?.name || '对方'}</div>
                    <div className="text-sm text-gray-400">等待对方更新</div>
                  </div>
                </div>
              </div>
            )}

            {/* 动态消息流（今日tab显示） */}
            {activeTab === 'today' && (
              <div className="bg-white rounded-2xl shadow-md p-4">
                <h3 className="font-bold mb-2">✨ 最近动态</h3>
                {feeds.length === 0 && <p className="text-gray-400 text-sm">暂无动态</p>}
                {feeds.slice(0, 10).map((feed, idx) => (
                  <div key={idx} className="text-sm py-2 border-b border-gray-100">
                    <span className="font-medium">{feed.user}</span> {feed.action} · {new Date(feed.time).toLocaleTimeString()}
                  </div>
                ))}
              </div>
            )}

            {/* 内容区域（非今日tab） */}
            {activeTab !== 'today' && (
              <div className="bg-white rounded-2xl shadow-md p-4 mb-4">
                {renderContent()}
              </div>
            )}

            {/* 底部导航栏 */}
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 max-w-md mx-auto rounded-t-2xl shadow-lg">
              {[
                { key: 'today', label: '今日', icon: '🏠' },
                { key: 'english', label: '英语', icon: '📖' },
                { key: 'time', label: '时间', icon: '⏰' },
                { key: 'status', label: '状态', icon: '📷' },
                { key: 'expense', label: '记账', icon: '💰' }
              ].map(tab => (
                <button
                  key={tab.key}
                  onClick={() => setActiveTab(tab.key)}
                  className={`flex flex-col items-center py-1 px-3 rounded-full transition ${activeTab === tab.key ? 'bg-purple-100 text-purple-700' : 'text-gray-400'}`}
                >
                  <span className="text-2xl">{tab.icon}</span>
                  <span className="text-xs mt-0.5">{tab.label}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ---------- 各功能组件 ----------
    const TodayView = ({ myName, otherName, todayData, otherTodayData }) => (
      <div>
        <p className="text-center text-gray-500 text-sm">点击下方标签页进行今日打卡</p>
      </div>
    );

    const EnglishView = ({ todayData, onSave }) => {
      const [minutes, setMinutes] = useState(todayData?.minutes || 0);
      const [content, setContent] = useState(todayData?.content || '');
      const [saved, setSaved] = useState(todayData?.done || false);
      const handleSave = () => {
        if (saved) { alert('今日已打卡，明天再来吧'); return; }
        if (!minutes) { alert('请输入学习时长'); return; }
        onSave(minutes, content);
        setSaved(true);
      };
      return (
        <div>
          <h3 className="font-bold text-lg mb-3">📖 英语学习打卡</h3>
          {saved ? (
            <div className="bg-green-100 p-4 rounded-xl text-center">✅ 今日已完成学习 {todayData?.minutes} 分钟</div>
          ) : (
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium">学习时长（分钟）</label>
                <input type="number" value={minutes} onChange={e => setMinutes(e.target.value)} className="w-full border rounded-xl p-2 mt-1" />
              </div>
              <div>
                <label className="block text-sm font-medium">学习内容</label>
                <input value={content} onChange={e => setContent(e.target.value)} placeholder="背单词、阅读..." className="w-full border rounded-xl p-2 mt-1" />
              </div>
              <button onClick={handleSave} className="w-full bg-purple-600 text-white py-2 rounded-xl">完成打卡</button>
            </div>
          )}
        </div>
      );
    };

    const TimeView = ({ todayData, onSave }) => {
      const [wakeUp, setWakeUp] = useState(todayData?.wakeUp || '');
      const [sleep, setSleep] = useState(todayData?.sleep || '');
      const [focus, setFocus] = useState(todayData?.focus || 0);
      const saved = todayData?.wakeUp && todayData?.sleep;
      const handleSave = () => {
        if (saved) { alert('今日已记录作息'); return; }
        if (!wakeUp || !sleep) { alert('请填写起床和睡觉时间'); return; }
        onSave(wakeUp, sleep, focus);
      };
      return (
        <div>
          <h3 className="font-bold text-lg mb-3">⏰ 日常时间监督</h3>
          {saved ? (
            <div className="bg-green-100 p-4 rounded-xl text-center">✅ 今日已记录：起床 {todayData.wakeUp}，睡觉 {todayData.sleep}</div>
          ) : (
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium">起床时间</label>
                <input type="time" value={wakeUp} onChange={e => setWakeUp(e.target.value)} className="w-full border rounded-xl p-2" />
              </div>
              <div>
                <label className="block text-sm font-medium">睡觉时间</label>
                <input type="time" value={sleep} onChange={e => setSleep(e.target.value)} className="w-full border rounded-xl p-2" />
              </div>
              <div>
                <label className="block text-sm font-medium">专注学习/工作时长（分钟）</label>
                <input type="number" value={focus} onChange={e => setFocus(e.target.value)} className="w-full border rounded-xl p-2" />
              </div>
              <button onClick={handleSave} className="w-full bg-purple-600 text-white py-2 rounded-xl">保存时间</button>
            </div>
          )}
        </div>
      );
    };

    const StatusView = ({ todayData, onSave }) => {
      const [text, setText] = useState(todayData?.text || '');
      const [image, setImage] = useState(todayData?.image || '');
      const saved = todayData?.text;
      const handleSave = () => {
        if (saved) { alert('今日已发布状态'); return; }
        if (!text) { alert('请填写状态内容'); return; }
        onSave(text, image);
      };
      return (
        <div>
          <h3 className="font-bold text-lg mb-3">📷 生活状态汇报</h3>
          {saved ? (
            <div className="bg-green-100 p-4 rounded-xl text-center">✅ 今日状态：{todayData.text}</div>
          ) : (
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium">状态文字</label>
                <textarea value={text} onChange={e => setText(e.target.value)} rows="3" placeholder="今天做了什么？心情如何？" className="w-full border rounded-xl p-2"></textarea>
              </div>
              <div>
                <label className="block text-sm font-medium">图片URL（可选）</label>
                <input value={image} onChange={e => setImage(e.target.value)} placeholder="https://..." className="w-full border rounded-xl p-2" />
              </div>
              <button onClick={handleSave} className="w-full bg-purple-600 text-white py-2 rounded-xl">发布状态</button>
            </div>
          )}
        </div>
      );
    };

    const ExpenseView = ({ todayData, onSave }) => {
      const [amount, setAmount] = useState(todayData?.amount || 0);
      const [category, setCategory] = useState(todayData?.category || '餐饮');
      const [note, setNote] = useState(todayData?.note || '');
      const saved = todayData?.amount > 0;
      const handleSave = () => {
        if (saved) { alert('今日已记账'); return; }
        if (!amount) { alert('请输入金额'); return; }
        onSave(amount, category, note);
      };
      return (
        <div>
          <h3 className="font-bold text-lg mb-3">💰 花销记账</h3>
          {saved ? (
            <div className="bg-green-100 p-4 rounded-xl text-center">✅ 今日记账：{todayData.category} {todayData.amount}元</div>
          ) : (
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium">金额（元）</label>
                <input type="number" value={amount} onChange={e => setAmount(e.target.value)} className="w-full border rounded-xl p-2" />
              </div>
              <div>
                <label className="block text-sm font-medium">类别</label>
                <select value={category} onChange={e => setCategory(e.target.value)} className="w-full border rounded-xl p-2">
                  <option>餐饮</option><option>购物</option><option>娱乐</option><option>交通</option><option>礼物</option><option>其他</option>
                </select>
              </div>
              <div>
                <label className="block text-sm font-medium">备注</label>
                <input value={note} onChange={e => setNote(e.target.value)} placeholder="例如：给对方买奶茶" className="w-full border rounded-xl p-2" />
              </div>
              <button onClick={handleSave} className="w-full bg-purple-600 text-white py-2 rounded-xl">记录开支</button>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
